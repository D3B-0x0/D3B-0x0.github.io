<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Deb">
  <!-- Terminal prompt mark on a Rosé Pine "main" tile. The chevron is foam
       and the cursor bar is love, matching the site's accent roles. Strokes
       are deliberately heavy so the mark survives being rendered at 16px. -->
  <rect width="100" height="100" rx="22" fill="#191724"/>
  <path
    d="M30 30 L52 50 L30 70"
    fill="none"
    stroke="#9ccfd8"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <rect x="58" y="62" width="22" height="9" rx="4.5" fill="#eb6f92"/>
</svg>
