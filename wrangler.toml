# Cloudflare Worker config for the portfolio site (static Vite build).
# Deploy with: npm run build && npx wrangler deploy
# Custom domain (aboutme.debnerd.in) is attached in the dashboard, not here.
name = "d3b-0x0-github-io"
compatibility_date = "2026-09-01"

# Serve only on the custom domain: no *.workers.dev, no per-deploy preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
